<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="apple-touch-icon" href="https://luiso112.github.io/Intercambios-raciones//logo2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Intercambios - MiDietaIntuitiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #18989b; 
            --primary-dark: #127a7c;
            --accent: #37b7b1;
            --bg: #f0f7f7;
            --card-bg: #ffffff;
            --text-dark: #1a3a3a;
            --text-light: #527171;
            --border: #d1e2e2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg); 
            color: var(--text-dark);
            line-height: 1.6;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card { 
            width: 100%;
            max-width: 600px; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(24, 152, 155, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary-dark);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label { 
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        select, input { 
            width: 100%; 
            padding: 14px 18px; 
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--text-dark);
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318989b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 16px;
        }

        select:focus, input:focus {
            border-color: #18989b;
            box-shadow: 0 0 0 4px rgba(24, 152, 155, 0.1);
        }

        button { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #18989b, var(--accent));
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 14px; 
            font-size: 1.1rem;
            font-weight: 700; 
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(24, 152, 155, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(24, 152, 155, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box { 
            margin-top: 30px; 
            padding: 25px; 
            background: var(--bg); 
            border-radius: 20px; 
            text-align: center;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-box .val {
            display: block;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 5px 0;
        }
        
        .medida-casera-box {
            margin-top: 15px; 
            font-size: 1.1rem; 
            color: var(--primary-dark); 
            background: rgba(55, 183, 177, 0.15); 
            padding: 12px; 
            border-radius: 12px;
            font-weight: 600;
            border: 1px dashed var(--accent);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .app-card {
                padding: 25px 20px;
                border-radius: 0;
                box-shadow: none;
            }
            .wrapper {
                padding: 0;
                background-color: #fff;
            }
            .header h1 { font-size: 1.2rem; }
            .result-box .val { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="app-card">
        <div class="header">
            <img src="logo.png" alt="Logo Luis Bertó" class="logo" onerror="this.src='https://static.wixstatic.com/media/893c52_04547285226c483a8b2734b42b9195f2~mv2.png'">
            <h1>Calculadora de Intercambios</h1>
            <p>MiDietaIntuitiva by Luis Bertó</p>
        </div>
        
        <div class="form-group">
            <label for="grupo">1. Grupo de alimento</label>
            <select id="grupo" onchange="actualizarAlimentos()">
                <option value="">-- Elige un grupo --</option>
                <option value="almidones">🌾 Almidones y Cereales</option>
                <option value="frutas">🍎 Frutas</option>
                <option value="lacteos">🥛 Lácteos Desnatados / Bajos en grasa</option>
                <option value="verduras">🥦 Verduras sin Almidón</option>
                <option value="proteina_muy_magra">🥩 Proteína Muy Magra</option>
                <option value="proteina_magra">🥩 Proteína Magra</option>
                <option value="grasas">🥑 Grasas</option>
            </select>
        </div>

        <div class="form-group">
            <label for="alimentoOriginal">2. Alimento pautado en tu dieta</label>
            <select id="alimentoOriginal">
                <option value="">-- Selecciona el grupo primero --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="intercambios">3. Número de raciones (Intercambios)</label>
            <input type="number" id="intercambios" min="0.25" step="0.25" placeholder="Ej: 2 o 1.5">
        </div>

        <div class="form-group">
            <label for="alimentoSustituto">4. Quiero cambiarlo por...</label>
            <select id="alimentoSustituto">
                <option value="">-- Selecciona el grupo primero --</option>
            </select>
        </div>

        <button onclick="calcularEquivalencia()">Calcular Equivalencia</button>

        <div class="result-box" id="resultado">
            <span style="font-size: 0.9rem; color: var(--text-light);">Peso exacto:</span>
            <span class="val" id="valor-resultado"></span>
            <span id="texto-post" style="font-weight: 600;"></span>
            
            <div class="medida-casera-box" id="medida-casera"></div>
        </div>
    </div>
</div>

<script>

            { nombre: "Lentejas, frijoles, garbanzos (cocidos)", peso: 90, unidad: "g", cValor: 0.5, cTexto: "taza(s)" }
        ],
        frutas: [
            { nombre: "Manzana, naranja o nectarina", peso: 113, unidad: "g", cValor: 1, cTexto: "ud(s) pequeña(s)" },
            { nombre: "Plátano / Banana", peso: 113, unidad: "g", cValor: 0.5, cTexto: "ud(s) grande(s)" },

            { nombre: "Tofu", peso: 113, unidad: "g", cValor: 0.5, cTexto: "taza(s)" }

            { nombre: "Aguacate", peso: 28, unidad: "g", cValor: 2, cTexto: "cda(s) sopera(s)" },

            { nombre: "Cacahuetes (maní)", peso: 10, unidad: "g", cValor: 10, cTexto: "unidad(es)" },

            { nombre: "Mantequilla de maní o almendra", peso: 8, unidad: "g", cValor: 1.5, cTexto: "cdta(s)" },

            { nombre: "Mayonesa baja en grasa", peso: 15, unidad: "g", cValor: 1, cTexto: "cda(s) sopera(s)" }
        ]
    };

    function actualizarAlimentos() {
        const grupo = document.getElementById("grupo").value;
        const selectOri = document.getElementById("alimentoOriginal");
        const selectSus = document.getElementById("alimentoSustituto");
        
        selectOri.innerHTML = '<option value="">-- Elige alimento original --</option>';
        selectSus.innerHTML = '<option value="">-- Elige el sustituto --</option>';

        if (grupo && baseDatos[grupo]) {
            baseDatos[grupo].forEach((item, index) => {
                let opt1 = document.createElement("option");
                opt1.value = index; 
                opt1.textContent = item.nombre;
                selectOri.appendChild(opt1);

                let opt2 = document.createElement("option");
                opt2.value = index;
                opt2.textContent = item.nombre;
                selectSus.appendChild(opt2);
            });
        }
    }

    function decimalAFraccion(decimal) {
        if (!decimal) return "";
        const entero = Math.floor(decimal);
        const frac = decimal - entero;
        let fracStr = "";
        
        if (Math.abs(frac - 0.25) < 0.05) fracStr = "1/4";
        else if (Math.abs(frac - 0.33) < 0.05) fracStr = "1/3";
        else if (Math.abs(frac - 0.5) < 0.05) fracStr = "1/2";
        else if (Math.abs(frac - 0.66) < 0.05) fracStr = "2/3";
        else if (Math.abs(frac - 0.75) < 0.05) fracStr = "3/4";
        else if (Math.abs(frac - 0) < 0.05) fracStr = "";
        else return parseFloat(decimal.toFixed(1)); 

        if (entero > 0 && fracStr) return `${entero} ${fracStr}`;
        if (entero > 0 && !fracStr) return `${entero}`;
        if (entero === 0 && fracStr) return fracStr;
        return parseFloat(decimal.toFixed(1));
    }

    function calcularEquivalencia() {
        const grupo = document.getElementById("grupo").value;
        const selectSus = document.getElementById("alimentoSustituto");
        const intercambios = parseFloat(document.getElementById("intercambios").value);
        
        const resBox = document.getElementById("resultado");
        const valRes = document.getElementById("valor-resultado");
        const textPost = document.getElementById("texto-post");
        const medCasera = document.getElementById("medida-casera");

        if (selectSus.value === "" || isNaN(intercambios) || intercambios <= 0) {
            alert("Por favor, selecciona los alimentos y el número de intercambios.");
            return;
        }

        const alimento = baseDatos[grupo][selectSus.value];
        
        const totalGramos = Number((alimento.peso * intercambios).toFixed(1));
        
        const totalCaseraDecimal = alimento.cValor * intercambios;
        const caseraFormateada = decimalAFraccion(totalCaseraDecimal);

        resBox.style.display = "block";
        valRes.innerText = `${totalGramos} ${alimento.unidad}`;
        textPost.innerText = `de ${alimento.nombre}`;
        
        medCasera.innerHTML = `Medida en casa: <br><span style="font-size:1.3rem;">🥄 ${caseraFormateada} ${alimento.cTexto}</span>`;
    }
</script>

</html>
